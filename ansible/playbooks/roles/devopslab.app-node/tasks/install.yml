---
  - name: Install curl
    ansible.builtin.apt:
      name: curl
      state: present

  - name: Install K3s
    ansible.builtin.shell: |
      curl -sfL {{ k3s_install_url }} | INSTALL_K3S_VERSION={{ k3s_version }} INSTALL_K3S_EXEC="--write-kubeconfig-mode {{ k3s_kubeconfig_mode }} --disable=traefik --tls-san {{ ansible_host }}" sh -s -
    args:
      creates: /usr/local/bin/k3s

  - name: Enable k3s service
    ansible.builtin.systemd:
      name: k3s
      enabled: true
      state: started